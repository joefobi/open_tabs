name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.5
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check Black formatting
        run: uv run --locked black --check .
      - name: Check import order
        run: uv run --locked isort --check-only .
      - name: Check types
        run: uv run --locked mypy .
