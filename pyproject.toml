[project]
name = "browser-task-sidebar"
version = "0.1.0"
description = "Browser task detection and context summaries"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
]

[dependency-groups]
dev = [
    "black>=26.1,<27",
    "httpx>=0.28.1",
    "isort>=7,<8",
    "mypy>=1.19,<2",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
skip = [".git", ".venv", "node_modules", "dist", "build"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
exclude = ["^\\.venv/", "(^|/)node_modules/", "(^|/)(dist|build)/"]
